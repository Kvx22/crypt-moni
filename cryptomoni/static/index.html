<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Risk Board</title>
<style>
:root{
  --bg:#0d1316; --surface:#141c20; --surface-2:#1a2429; --line:#26333a; --fg:#e7ecee; --muted:#93a1a8; --faint:#5f6f77;
  --accent:#e0ae55; --accent-ink:#1b1305; --good:#4fae82; --bad:#e0685c; --warn:#e0a24f;
  --c-vera:#d9786b; --c-kai:#7a8fd9; --c-imani:#c9a14a; --c-marguerite:#8fa06a; --c-idris:#9b86c9;
  --r-crash:#d6584c; --r-bear:#e08f46; --r-neutral:#8c98a2; --r-bull:#4fae82; --r-euphoria:#b48ae6;
  --t-low:#4fae82; --t-elevated:#b9b25a; --t-high:#e08f46; --t-extreme:#e0685c;
  --eq:#e7ecee; --bench:#6f8d9c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f1f4f4; --surface:#ffffff; --surface-2:#eef2f2; --line:#d5dddf; --fg:#14201f; --muted:#546368; --faint:#8a989d;
  --accent:#9a6a0e; --accent-ink:#ffffff; --good:#1f7a55; --bad:#b83d32; --warn:#a96a12;
  --c-vera:#b8503f; --c-kai:#4a62b8; --c-imani:#98730f; --c-marguerite:#62753a; --c-idris:#6f58a8;
  --r-crash:#b83d32; --r-bear:#b8691f; --r-neutral:#6a7780; --r-bull:#2a8a60; --r-euphoria:#8a5fc4;
  --t-low:#1f7a55; --t-elevated:#857c12; --t-high:#b8691f; --t-extreme:#b83d32;
  --eq:#14201f; --bench:#6f8d9c; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f1f4f4; --surface:#ffffff; --surface-2:#eef2f2; --line:#d5dddf; --fg:#14201f; --muted:#546368; --faint:#8a989d;
  --accent:#9a6a0e; --accent-ink:#ffffff; --good:#1f7a55; --bad:#b83d32; --warn:#a96a12;
  --c-vera:#b8503f; --c-kai:#4a62b8; --c-imani:#98730f; --c-marguerite:#62753a; --c-idris:#6f58a8;
  --r-crash:#b83d32; --r-bear:#b8691f; --r-neutral:#6a7780; --r-bull:#2a8a60; --r-euphoria:#8a5fc4;
  --t-low:#1f7a55; --t-elevated:#857c12; --t-high:#b8691f; --t-extreme:#b83d32;
  --eq:#14201f; --bench:#6f8d9c; color-scheme:light;}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-block:18px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:-.01em} h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.good .dot{background:var(--good)} .warn .dot{background:var(--warn)} .bad .dot{background:var(--bad)}
.pill.bad{border-color:var(--bad)} .pill.warn{border-color:var(--warn)}
.live .dot{animation:pulse 2s infinite} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
button{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--muted)} button.kill{border-color:var(--bad);color:var(--bad);font-weight:600}
button.kill:hover{background:var(--bad);color:#fff}
button:focus-visible,.seat:focus-visible,th[data-k]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border:1px solid var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)} .g2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:1000px){.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;margin-bottom:14px}
.grid>.card{margin-bottom:0}
.sub{color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
/* regime */
.reg-big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.reg-name{font-size:34px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.pbar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:12px 0 6px;gap:2px}
.pbar>div{min-width:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#0d1316;font-weight:600;overflow:hidden}
.plabels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center}
.fc{display:grid;grid-template-columns:72px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12px;margin:3px 0;color:var(--muted)}
.fc i{display:block;height:7px;border-radius:4px}
.strip{display:flex;gap:1px;height:16px;margin:6px 0 2px}.strip i{flex:1;border-radius:2px;min-width:1px}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:10px}
.feat div{background:var(--surface-2);border-radius:8px;padding:6px 9px}.feat b{display:block;font:600 15px var(--mono)}.feat span{font-size:11px;color:var(--muted)}
/* board */
.seats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.seat{--c:var(--fg);text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 4px 8px;background:var(--surface-2);transition:border-color .2s,box-shadow .2s,transform .2s;min-width:0;cursor:pointer;color:inherit;font:inherit}
.seat.talk{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent);transform:translateY(-3px)}
.seat .face{height:96px} .seat svg{height:100%;width:100%;display:block}
.seat b{display:block;font-size:12px;margin-top:2px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .seat .role{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .vote{font:700 19px var(--mono);margin-top:3px} .seat .st{font-size:11px;color:var(--muted)}
.wb{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;align-items:center;font-size:10px;color:var(--faint);margin:3px 6px 0;text-align:left}
.wb span:last-child{height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:block}.wb i{display:block;height:100%;background:var(--c)}
.seat .pk{font:600 11px var(--mono);margin-top:5px;color:var(--fg)}
.eyes>g{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.cap{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:84px}
.cap .who{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
.cap .say{font-size:16px;line-height:1.4}
.cap .say.typing::after{content:"▍";color:var(--muted);margin-left:1px}
.cap button{padding:0 8px;font-size:11px}
.chain{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px;align-items:center;font-size:12px}
.chain .n{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.chain .n b{font:600 14px var(--mono)}
.why{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:12.5px} th{font-weight:600;color:var(--muted);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle} td.r,th.r{text-align:right} td.c,th.c{text-align:center}
th[data-k]{cursor:pointer;user-select:none} th[data-k]:hover{color:var(--fg)} th.on{color:var(--accent)}
.tw{max-height:330px;overflow:auto} .tx{overflow-x:auto}
.up{color:var(--good)} .dn{color:var(--bad)}
.tier{font:600 11px var(--mono);border-radius:6px;padding:2px 7px;white-space:nowrap;border:1px solid}
.tier.LOW{color:var(--t-low);border-color:var(--t-low)} .tier.ELEVATED{color:var(--t-elevated);border-color:var(--t-elevated)}
.tier.HIGH{color:var(--t-high);border-color:var(--t-high)} .tier.EXTREME{color:#fff;background:var(--t-extreme);border-color:var(--t-extreme)}
.vd{font:700 11px var(--mono);border-radius:6px;padding:2px 8px;white-space:nowrap}
.vd.BUY{background:var(--good);color:#fff} .vd.WATCH{border:1px solid var(--accent);color:var(--accent)} .vd.NEUTRAL{color:var(--muted);border:1px solid var(--line)}
.vd.AVOID{border:1px solid var(--bad);color:var(--bad)} .vd.VETOED{background:var(--bad);color:#fff}
.vt{display:inline-flex;gap:3px}.vt i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c);display:inline-block}
.vt i.y{background:var(--c)} .vt i.n{border-style:solid;background:none;opacity:.9;position:relative} .vt i.n::after{content:"";position:absolute;left:1px;right:1px;top:50%;height:1.5px;background:var(--c);transform:translateY(-50%)}
.vt i.a{opacity:.35}
.rng{position:relative;width:64px;height:8px;background:var(--line);border-radius:4px}.rng i{position:absolute;top:-2px;width:4px;height:12px;border-radius:2px;margin-left:-2px;background:var(--fg)}
.sig{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin:1px 2px 1px 0;white-space:nowrap;color:var(--muted)}
.sig.g{color:var(--good);border-color:var(--good)} .sig.b{color:var(--bad);border-color:var(--bad)} .sig.w{color:var(--warn);border-color:var(--warn)}
.coin b{font:600 13px var(--mono)}
.opp td{padding:7px 6px}.opp tr.sub-row td{border-bottom:1px solid var(--line);padding-top:0;color:var(--muted);font-size:12.5px}
.opp tr.main td{border-bottom:0}
.rv{font:600 11px var(--mono);border-radius:6px;padding:1px 7px;border:1px solid;white-space:nowrap}
.rv.favorable{color:var(--good);border-color:var(--good)}.rv.mixed{color:var(--warn);border-color:var(--warn)}.rv.unfavorable{color:var(--bad);border-color:var(--bad)}.rv.unverified{color:var(--muted);border-color:var(--line)}
.rnote{margin-top:4px;color:var(--fg)}.rnote a{color:var(--accent)}
.sig.ai{color:var(--warn);border-color:var(--warn)}
.rs-st{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;margin:2px 4px 2px 0;font-size:12px}
.rs-st b{font-weight:600} .rs-st.active{border-color:var(--good)} .rs-st.active b{color:var(--good)} .rs-st.off b{color:var(--faint)}
.rs-st button,.rs-fix{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.rs-note{border-top:1px solid var(--line);padding:6px 0;font-size:12.5px} .rs-note .d{font-size:11px;color:var(--faint);font-family:var(--mono)}
.rs-note a{color:var(--fg)} .rs-form{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.rs-form select{font-size:12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:1px 4px}
.thesis{font-size:12px;color:var(--muted);margin-top:3px;max-width:520px}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
#rb td.coin,#rb th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.riskbar{display:inline-block;width:38px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}.riskbar i{display:block;height:100%}
/* feeds */
.ev{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:7px 0} .ev.warn{border-color:var(--warn)} .ev.critical{border-color:var(--bad)} .ev.info{border-color:var(--faint)}
.ev .t{font-weight:600;font-size:13px} .ev .m{color:var(--muted);font-size:12.5px} .ev .d{font-size:11px;color:var(--faint);font-family:var(--mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px} .chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:none;color:var(--muted)} .chip.on{color:var(--fg);border-color:var(--accent)}
.b{font-size:11px;border-radius:6px;padding:1px 7px;border:1px solid var(--line)}
button.ok{border-color:var(--good);color:var(--good);font-weight:600} button.ok:hover{background:var(--good);color:#fff}
.ob{border:1px solid var(--accent)} .ob h2{color:var(--accent)} .st{font:500 11px var(--mono);white-space:nowrap}
.st.sent,.st.approved{color:var(--good)} .st.failed,.st.check,.st.skipped{color:var(--bad)} .st.pending{color:var(--accent)} .b.buy{color:var(--good);border-color:var(--good)} .b.sell{color:var(--bad);border-color:var(--bad)}
/* learning */
.lv{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr) 92px;gap:4px 10px;align-items:center;font-size:12px;margin-top:6px}
.lv .tr{position:relative;height:16px}.lv .tr::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.lv .bar{position:absolute;top:4px;height:8px;border-radius:2px}.lv .bar.p{top:0;height:16px;border:1px dashed var(--muted);background:none}
.lv .v{font:11px var(--mono);text-align:right;color:var(--muted);white-space:nowrap}
/* guards */
.guard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.guard:last-child{border:none} .guard .v{font-weight:600} .guard .v.good{color:var(--good)} .guard .v.bad{color:var(--bad)} .guard .v.warn{color:var(--warn)}
.meter{grid-column:1/3;height:5px;background:var(--line);border-radius:3px;position:relative;overflow:visible;margin-top:3px} .meter i{display:block;height:100%;border-radius:3px;background:var(--muted)}
.meter u{position:absolute;top:-3px;width:1px;height:11px;background:var(--faint)}
.ranges{display:flex;gap:6px;float:right} .ranges button{padding:2px 9px;font-size:12px} .ranges button.on{border-color:var(--accent);color:var(--accent)}
svg text{fill:var(--muted);font-size:11px;font-family:system-ui,sans-serif}
.axis{stroke:var(--line)} .tip{position:fixed;pointer-events:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;z-index:9;display:none;max-width:280px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.foot{color:var(--faint);font-size:12px;margin-top:18px;max-width:100ch}
.sl{display:grid;grid-template-columns:92px minmax(0,1fr) 100px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.sl .bar{height:12px;background:var(--line);border-radius:4px;position:relative} .sl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--muted)} .sl .bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
@media(max-width:700px){
  .seat .role,.wb{display:none} .seat .face{height:68px} .seat .vote{font-size:15px} .seat b{font-size:11px}
  .reg-name{font-size:28px} .cap .say{font-size:15px} .cap{min-height:108px}
}
@media (prefers-reduced-motion: reduce){.eyes>g,.live .dot{animation:none}.seat{transition:none}}
</style></head>

function signals(m) {
  var o = [];
  if (m.price > m.hi7) o.push('<span class="sig g">▲ 7d high</span>');
  if (m.price < m.lo7) o.push('<span class="sig b">▼ 7d low</span>');
  if (Math.abs(m.z_1h) >= 3) o.push('<span class="sig w">' + (m.z_1h > 0 ? "+" : "−") + Math.abs(m.z_1h).toFixed(1) + 'σ hour</span>');
  if (m.vol_surge >= 2.5) o.push('<span class="sig w">vol ×' + m.vol_surge.toFixed(1) + '</span>');
  if (m.rsi >= 75) o.push('<span class="sig b">overbought</span>');
  if (m.rsi <= 25) o.push('<span class="sig g">oversold</span>');
  if (m.vol_ratio >= 1.8) o.push('<span class="sig w">vol expanding</span>');
  var r = m.research;
  if (r) {
    if (r.halted) o.push('<span class="sig b" title="the exchange reports trading halted">halted</span>');
    if (r.penalty > 0.01) o.push('<span class="sig b" title="research risk flags: ' + esc((r.flags || []).join(", ")) + ' (capped penalty ' + r.penalty.toFixed(2) + (r.applied && r.applied.penalties ? ", applied" : ", shadow") + ')">⚑ ' + esc((r.flags || [])[0] || "risk") + '</span>');
    if (r.n > 0) o.push('<span class="sig' + (r.score > 0.15 ? " g" : r.score < -0.15 ? " b" : "") + '" title="' + r.n + ' independent sources over ' + (r.kinds || []).length + ' kinds' + (r.top && r.top[0] ? ": " + esc(r.top[0].title) : "") + '">📰 ' + r.n + '</span>');
  }
  return o.join("") || '<span class="sub">–</span>';
}

function post(u) { return fetch(u, { method: "POST", headers: { "X-CM": "1", "X-CM-Token": TOKEN } }).then(function (r) { return r.json(); }).then(function (j) { if (j.error) { if (/token/.test(j.error)) { var t = prompt("Approval token (the CM_TOKEN value in your .env file):"); if (t) { TOKEN = t.trim(); try { localStorage.setItem("cm_token", TOKEN); } catch (e) {} } } else alert(j.error); } S.ver = ""; poll(); }); }

  }

var typeT = null, mouthT = null, dwellT = null;
function seatEl(k) { return document.querySelector('.seat[data-k="' + k + '"]'); }
function setMood(k, m) { var el = seatEl(k); if (!el) return; var b = BROWS[m] || BROWS.calm; el.querySelector(".bl").setAttribute("d", b[0]); el.querySelector(".br").setAttribute("d", b[1]); el.querySelector(".lip").setAttribute("d", LIPS[m] || LIPS.calm); }
function stopTalk() { clearInterval(typeT); clearInterval(mouthT); clearTimeout(dwellT); document.querySelectorAll(".seat .mo").forEach(function (m) { m.setAttribute("ry", 0); }); }
function speakInit() {
  var s = S.state.snapshot; stopTalk();
  s.advisors.forEach(function (a) { setMood(a.key, a.key == "imani" && a.stance == "hold" ? "firm" : MOOD[a.stance] || "calm"); });
  S.lines = s.minutes || []; say();
}
function say() {
  if (!S.lines || !S.lines.length || !$("#capsay")) return;
  stopTalk();
  var L = S.lines[S.talk % S.lines.length], a = ADV[L.key], el = seatEl(L.key), text = "“" + L.text + "”";
  document.querySelectorAll(".seat").forEach(function (x) { x.classList.toggle("talk", x === el); });
  setMood(L.key, L.stance == "pick" ? PICK_MOOD[L.key] : (MOOD[L.stance] || "calm"));
  var who = $("#capwho"); who.textContent = a.name + " · " + (L.stance == "pick" ? "pick desk" : "exposure board"); who.style.color = a.color;
  var sayEl = $("#capsay"), mo = el && el.querySelector(".mo");
  S.talk++;
  if (reduce || S.paused) { sayEl.classList.remove("typing"); sayEl.textContent = text; if (!S.paused) dwellT = setTimeout(say, 6000 + text.length * 30); return; }
  var n = 0; sayEl.textContent = ""; sayEl.classList.add("typing");
  mouthT = setInterval(function () { if (mo) mo.setAttribute("ry", (2 + Math.random() * 6).toFixed(1)); }, 110);
  typeT = setInterval(function () { n++; sayEl.textContent = text.slice(0, n);
    if (n >= text.length) { clearInterval(typeT); clearInterval(mouthT); if (mo) mo.setAttribute("ry", 0); sayEl.classList.remove("typing"); dwellT = setTimeout(say, 1600 + text.length * 22); } }, 24);
}

/* ---------- data ---------- */
function get(u) {
  if (STATIC) return Promise.resolve(STATIC[u.split("?")[0].replace("/api/", "")]);
  return fetch(u, { cache: "no-store" }).then(function (r) { return r.json(); });
}
function poll() {
  get("/api/state").then(function (d) {
    if (d.error) { $("#app").innerHTML = '<div class="empty">' + esc(d.error) + '</div>'; return; }
    var v = JSON.stringify(d.version) + d.kill, lv = d.live ? d.live.ts : 0, changed = v !== S.ver, lchanged = lv !== S.lver;
    S.state = d; S.lver = lv;
    if (!changed) {
      if (lchanged) render("live");
      else if ($("#hdr")) { $("#hdr").innerHTML = headerHTML(d); bind(); }   // keeps "last tick Xs ago" honest
      return;
    }
    var first = S.ver === "";
    S.ver = v;
    return Promise.all([get("/api/history?limit=2000"), get("/api/trades?limit=80"), get("/api/events?limit=150"), get("/api/alerts?limit=60"), get("/api/outbox?limit=60")]).then(function (r) {
      S.outbox = r[4] || [];
      var last = function (h) { return h.length ? h[h.length - 1].id : null; };
      var newSnap = first || last(r[0]) !== last(S.hist);
      S.hist = r[0]; S.trades = r[1]; S.events = r[2]; S.alerts = r[3];
      render(newSnap ? "all" : "live");
    });
  }).catch(function (e) { $("#app").innerHTML = '<div class="empty">Cannot reach the dashboard server: ' + esc(e) + '</div>'; });
}
poll(); pollResearch(); if (!STATIC) { setInterval(poll, 2000); setInterval(pollResearch, 15000); }
</script></body></html>
